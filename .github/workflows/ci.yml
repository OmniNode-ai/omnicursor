name: CI

# Hardened CI (Phase-2 A10.7). Every PR-blocking job below is secret-free by
# design: contributors work via forks, where org secrets are unavailable, so a
# gate that needs one can never be required. Gates that would need org secrets
# (CodeRabbit thread gate, Linear automations, auto-merge) are proposed in the
# PR-4 body instead of implemented here.

on:
  pull_request:
    branches: [main]
  # Fork PRs need a maintainer's "Approve and run" before Actions execute, and
  # that has never been granted — so as of #8 this workflow had ZERO runs in the
  # repo's history and every PR merged on local-gate evidence alone. The push
  # trigger guarantees a post-merge run on main regardless of that friction;
  # workflow_dispatch lets a maintainer run CI on any ref without a PR.
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly moving-head probe: sibling-drift tracks the LIVE omnimarket /
  # omnibase_core / omniclaude dev heads only on this schedule, where a
  # failure can't block an unrelated PR. PR/push runs use the pinned refs
  # below so a required check never changes result while the PR's SHA is
  # unchanged (PR #10 review, point 2).
  schedule:
    - cron: "17 9 * * 1"

# A superseded PR run provides no signal — cancel it. Push runs on main are
# never cancelled: every merge commit keeps a complete CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: no job writes to the repo.
permissions:
  contents: read

jobs:
  # Pre-existing job: ruff + pytest + skill-compliance coverage
  # (+ ruff format, ported from omniclaude).
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # .[mcp] so the MCP launcher smoke test (tests/test_mcp_launcher.py)
          # runs here instead of skipping (PR #10 review, point 4).
          pip install -e ".[dev,mcp]" ruff

      - name: Lint
        run: ruff check src/ tests/ hooks/ scripts/ci/

      - name: Format check
        run: ruff format --check src/ tests/ hooks/ scripts/ci/

      - name: Test
        run: pytest tests/ -v

      - name: Validate skill compliance coverage
        run: python scripts/ci/check_frontmatter.py --compliance-only

  # Type check, ported from omniclaude (mypy config in pyproject.toml).
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy

      - name: MyPy
        run: mypy src/

  # Structural plugin gates (A10.7): manifest/MCP wiring, skill+agent
  # frontmatter & exact skill coverage, hardcoded-topic-literal guard
  # (OMN-13944 analog — Jonah's PR-#4 follow-up), stdlib-only hook imports,
  # shell hygiene.
  plugin-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # .[dev] declares jsonschema (manifest gate) — one source of truth
          # in pyproject.toml instead of an ad-hoc pip line that can drift.
          pip install -e ".[dev]"

      - name: Manifest + MCP wiring gate (pinned official schema)
        run: python scripts/ci/check_manifest.py

      - name: Skill/agent frontmatter + category gate
        run: python scripts/ci/check_frontmatter.py

      - name: Hardcoded topic-literal gate (hooks/)
        run: python scripts/ci/check_topic_literals.py

      - name: Hook stdlib-only import gate
        run: python scripts/ci/check_hook_stdlib_only.py

      - name: Shellcheck
        run: shellcheck scripts/*.sh .githooks/pre-commit

  # Security scans, ported from omniclaude's fork-safe zone (bandit +
  # detect-secrets with a content-addressed baseline compare).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: python -m pip install bandit detect-secrets

      - name: Bandit security scan
        run: |
          bandit -r src/ \
            --exclude .venv/,__pycache__/ \
            --confidence-level medium --severity-level medium \
            -f txt

      - name: Detect-secrets baseline compare
        run: |
          cp .secrets.baseline .secrets.baseline.bak
          # tests/ IS scanned: its fake fixtures (redaction inputs) are audited
          # baseline entries, so a real credential in a test still fails.
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '\.venv/' \
            --exclude-files '^build/' \
            --exclude-files 'egg-info/' \
            --exclude-files '^\.git/' \
            --exclude-files '\.env\.omninode\.example$'
          # Content-addressed compare (file, hashed_secret): new findings fail;
          # line-number shifts of audited baseline entries do not.
          python3 - <<'EOF'
          import json, sys
          old = json.load(open(".secrets.baseline.bak"))
          new = json.load(open(".secrets.baseline"))
          old_set = {(f, s["hashed_secret"])
                     for f, secrets in old.get("results", {}).items()
                     for s in secrets}
          new_set = {(f, s["hashed_secret"])
                     for f, secrets in new.get("results", {}).items()
                     for s in secrets}
          fresh = new_set - old_set
          if fresh:
              print("New potential secrets (audit them, then refresh .secrets.baseline):")
              for f, h in sorted(fresh):
                  print(f"  {f} ({h[:12]}…)")
              sys.exit(1)
          print("No new secrets vs baseline.")
          EOF

  # Local (offline) markdown link check over the installer-facing docs.
  # Offline keeps the gate deterministic on fork PRs; external-link checking
  # can be enabled later if the team wants it (omniclaude runs hosted lychee
  # with an exclude list).
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check markdown links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >
            --offline
            --no-progress
            README.md
            CHANGELOG.md
            docs/

  # Drift-catchers vs the platform (Jonah's stated intent for mirroring
  # omniclaude CI: "reduce manual work and catch drift"). Checks out the
  # public sibling repos so the canonical-event round-trip, the real
  # EventRegistry load and the redaction-table byte-parity check — tests
  # that silently skip when siblings are absent — actually run. Tokenless
  # (all three repos are public), so fork-safe.
  sibling-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Governed sibling pins: PR/push runs are deterministic against these
      # SHAs; only the weekly scheduled run probes the moving dev heads.
      # Refresh deliberately with a chore commit when adopting new heads.
      OMNIMARKET_PIN: 9067a97f29e4e53b010892b48b265fa73127c36e
      OMNIBASE_CORE_PIN: 665b9657f2d310cec647fdc5e0093ae28835bbab
      # omniclaude is the redaction-pattern donor (tests/test_redaction.py
      # TestByteParity). A red weekly run here means the donor moved: re-port
      # the _SECRET_PATTERNS block into hooks/lib/redaction.py, then
      # bump this pin.
      OMNICLAUDE_PIN: 00589f12c8b66447f7da23fff0b72dacd6f3446d

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: omnicursor

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: OmniNode-ai/omnimarket
          ref: ${{ github.event_name == 'schedule' && 'dev' || env.OMNIMARKET_PIN }}
          path: omnimarket

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: OmniNode-ai/omnibase_core
          ref: ${{ github.event_name == 'schedule' && 'dev' || env.OMNIBASE_CORE_PIN }}
          path: omnibase_core

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: OmniNode-ai/omniclaude
          ref: ${{ github.event_name == 'schedule' && 'dev' || env.OMNICLAUDE_PIN }}
          path: omniclaude

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install omnicursor
        working-directory: omnicursor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Registry + canonical-event + redaction drift tests (siblings present)
        working-directory: omnicursor
        run: |
          pytest tests/test_event_registry_tier.py tests/test_canonical_event.py tests/test_redaction.py -v -rs | tee drift-output.txt
          # The sibling-dependent tests skip when checkouts are missing; with
          # all three siblings checked out, a skip means the wiring broke.
          if grep -q "SKIPPED" drift-output.txt; then
            echo "::error::sibling-dependent drift tests were skipped despite the checkouts"
            exit 1
          fi

  # Single API-stable aggregate for branch protection (omniclaude pattern):
  # require "ci-summary" instead of enumerating jobs.
  ci-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-test, typecheck, plugin-gates, security, links, sibling-drift]
    if: always()

    steps:
      - name: Verify all gates passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = [k for k, v in needs.items() if v.get('result') != 'success']
          print(' '.join(bad))
          ")
          if [ -n "$failed" ]; then
            echo "::error::failed gates: $failed"
            exit 1
          fi
          echo "All gates green."
